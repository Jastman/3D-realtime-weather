name: Deploy WeatherViz 3D to GitHub Pages

on:
  push:
    branches:
      - claude/3d-weather-app-clouds-wsAIg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: weather-3d-next/package-lock.json

      - name: Install dependencies
        working-directory: weather-3d-next
        run: npm ci

      - name: Build (static export)
        working-directory: weather-3d-next
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          # Add your Google Maps key here as a repo secret if you have one:
          # NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      - name: Add .nojekyll (prevent Jekyll processing)
        run: touch weather-3d-next/out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./weather-3d-next/out
          force_orphan: true
          commit_message: 'deploy: WeatherViz 3D [skip ci]'
